# ---- Pattern writers (PL11 Euclidean fills): telling stock a note track's pattern changed.
[function.rec_touch]
addr = 0x0803F8D4
expect = "38b50446"   # push {r3, r4, r5, lr}; mov r4, r0
proto = "void rec_touch(void *rec)"
notes = "Track t's recorder (rec = [recorders + 4 t]): rewrites parameter 0 of its store [rec + 0x4C] with its own value and commits it (0x080354FA, 0x080353C0), so the store's listeners refresh. The recorder calls it after each commit. Without it the Note view's step pads keep showing the old steps after a direct write (until a project load); playback reads the steps directly either way. UI task from slim; took no DSP lock in emulation."
source = "re/app.asm; slim emulation 2026-10-18 (PL11 device step 9: Euclid-written steps not lit in the Note view until a restart)"

# ---- PL17: the drum Write through the drum editor's step store (stock's generic double-buffered parameter store).
[function.store_commit]
addr = 0x080353C0
expect = "f8b504460026"   # push {r3-r7, lr}; mov r4, r0; movs r6, #0
proto = "void store_commit(void *store)"
notes = "A parameter store's commit: flips the read buffer of every dirty parameter, calls each listener whose mask meets the dirty mask, clears it. On a drum's step store ([drum recorder + 0x4C]) listener 0 is the drum editor (0x0803EA1C), which writes every step of the store's read view into the pattern it shows (all 128 B), and the other four are the drum views (step LEDs, velocity, microstep, probability): too long to run masked. UI task from slim."
source = "docs/investigations/2026-10-25-drums-pattern.md §2 (re/app.asm 0x08035324-0x080355D4, the dump's listeners); drums spike 1 (2026-10-25-drums-emulation.md, q1_write.py)"

[function.store_touch_all]
addr = 0x08035456
expect = "f8b50446a068"   # push {r3-r7, lr}; mov r4, r0; ldr r0, [r4, #8]
proto = "void *store_touch_all(void *store)"
notes = "Marks every parameter of a store written (each one's read buffer copied to its write buffer first, through the write pointer 0x080354FA, from 0x0803545A) and returns the write buffer, so the next store_commit refreshes every listener. PL17's drum Write calls it unmasked after writing both buffers: a recorder commit in between is copied through, not lost."
source = "docs/investigations/2026-10-25-drums-pattern.md §2 (re/app.asm 0x08035456); drums spike 1 (q1_write.py)"

# ---- PL18: chords in step entry (spec 2026-10-26-step-entry-chords-design.md, "How stock does it").
[function.param_wptr]
addr = 0x080354FA
expect = "f0b44368"   # push {r4-r7}; ldr r3, [r0, #4]
proto = "volatile uint8_t *param_wptr(void *store, uint32_t index)"
notes = "A parameter store's write pointer: the write buffer of parameter `index` (the first call after a commit copies the read buffer into it), marked dirty; store_commit then flips it in. param_get keeps reading the read buffer until that commit."
source = "re/app.asm 0x080354FA; tests/notes.py PARAM_WPTR"

[hook.preview_end]
kind = "entry"
addr = 0x0804B00C
expect = "2de9f041"   # push.w {r4, r5, r6, r7, r8, lr}
displace = 4
args = ["void *view"]
ret = "void"
context = "ui"
notes = "Note view: ends the held step's preview. For each used unit of the edit store [view + 0x24] whose note no pad slot [view + 0x40 + 0-31] holds: note_sink_off(sink [view + 0x18], note, [view + 0x80 + note]) (0x20 when the preview sounded it), so the router ends the note only when that source still owns it. Only caller: the Note view's store listener 0x0804B272 at 0x0804B604, on two triggers: the held step is let go (p0 of [view + 0x2C] back to 0, with step_sounds), and, with a step held, a change of the play store 0x20011034 or the track's mute store ([view + 0x1C] / [view + 0x20]) that stops the step's notes sounding (step_sounds = stopped or muted): e.g. Play started with a step held. The task of the second trigger on an external MIDI Start is not established. The preview (0x0804B456 on an add's commit, 0x0804B4E0 on a step's load) sounds a unit no pad slot holds with source 0x20 and sets [view + 0x80 + note] = 0x20."
source = "re/app.asm 0x0804B00C-0x0804B076, 0x0804B2DC-0x0804B2F2, 0x0804B456-0x0804B4DE; tests/test_step_entry.py (pad first, the step let go first)"

[hook.step_add]
kind = "entry"
addr = 0x0804B094
expect = "2de9f84f"   # push.w {r3, r4, r5, r6, r7, r8, sb, sl, fp, lr}
displace = 4
args = ["void *view", "uint32_t note", "uint32_t vel"]
ret = "void"
context = "ui"
notes = "Note view: adds `note` (a keyboard pitch) at `vel` to the held step's edit store [view + 0x24] (parameter 0 byte 0 = the mask of used units, byte 1 = the step's probability; parameters 1-6 = the units: note, gate | tie << 7, microstep, velocity). Takes the longest gate of the used units (tie bit stripped), the first free unit (all six used: adds nothing, no commit), writes note, velocity, the gate (none, i.e. longest 0: 6 = one step, and the probability byte becomes 7), microstep 0, the mask bit, through the write pointer 0x080354FA, then commits (0x080353C0); the commit's listeners write the step into the pattern and preview the step's notes. Two callers: the Note view's pad press 0x0804AB5A tail-calls it at 0x0804ACB2 (a step held and the pad's pitch not removed from it; vel after the fixed-velocity rule, 96), and the held-step listener 0x0804B1F2 (thunk 0x0804B1F0) calls it at 0x0804B246 for each held key pad 17-32 ([view + 0x50 + i] its pitch, [view + 0x70 + i] its velocity) whose pitch is not in the step. Confirmed in emulation 2026-10-28 (both routes, the gate and tie rule, the preview)."
source = "re/app.asm 0x0804B094-0x0804B170; PL18 spec; tests/test_step_entry.py"

[hook.note_pad_press]
kind = "entry"
addr = 0x0804AB5A
expect = "2de9f84f"   # push.w {r3, r4, r5, r6, r7, r8, sb, sl, fp, lr}
displace = 4
args = ["void *view", "uint32_t pad", "uint32_t vel"]
ret = "void"
context = "ui"
notes = "The Note view's pad press, before the fixed-velocity rule (vel becomes 96 at 0x0804AB74). No step held (p0 of [view + 0x2C] == 0): tail-calls pad_note_on (0x0804ACBE). A step held: for each used unit of the edit store [view + 0x24] whose note snapped by scale_snap([kbd + 0x0C], note) equals the pad's pitch [kbd + 0x14 + note_pad_index] it removes the unit: clears its mask bit only through param_wptr (0x0804ABD6; the unit's bytes stay), commits, and when step_sounds(view) ends the pitch through the sink's slot 1 (note_sink_off(sink, pitch, [view + 0x80 + pitch]), the source the pitch last sounded from: 0x20 = the step's preview, 0x0804AFF8) and clears the first key pad 16-31 whose [view + 0x40 + pad] holds the pitch ([+ 0x40] and [+ 0x60] = 0). Nothing removed and the pitch non-zero: tail-calls step_add (0x0804ACB2)."
source = "re/app.asm 0x0804AB5A-0x0804ACC2; PL18 spec; tests/test_step_entry.py (removal)"

