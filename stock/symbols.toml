notes = "The device settings' parameter store (use its address; [recorders + 4 t] + 0x24 for every recorder): parameter 2 bit 12 set = record quantise off. Shift + Record flips the bit at once (0x08045A44) and Record's LED with Shift shows it (0x08045B0E); the recorders' [+ 0x35] follows at their next step boundary (hook rec_quant). Bit 1 of parameter 2 = fixed velocity (tests/drums.py ROUTER)."
