# ---- Sequencer playback (Synth 1 / 2, MIDI 1 / 2). Evidence: upstream SEQWD (RC0.5 era, DWT watchpoint on the device
#      2026-10-12: the player reads a step's note only while playing) and SC39 random-mutate; upstream docs/NOTAS.md.
#      Callable from C since PL19 (seq_note_on, seq_end_entry: the pattern strum's late notes, features/chord/pstrum.c);
#      hooks seq_play_step, seq_end_all (PL19). Pattern of track t = [player + 0x48] + 0xCA8 × pattern; step =
#      + 28 × step: [0] note-slot mask, [1] probability, then 6 slots of (note, length | tie << 7, microstep, velocity).
[function.seq_units_start]
addr = 0x08040D4C
expect = "062b2de9"   # cmp r3, #6; push.w {...}
notes = "Player (this, pattern, step, tick): marks which note slots start this microstep in [this + 0x13C + microstep] ([step + 1] probability against [this + 4] & 7, [slot + 6] microstep), then ends those already sounding (active-note tables this + 0x54 / 0x128, looked up with the step's own note)."
source = "upstream NOTAS.md SEQWD (device)"

[function.seq_play_step]
addr = 0x08040E5A
expect = "2de9f84f"   # push.w {r3, r4, r5, r6, r7, r8, r9, sl, fp, lr}
notes = "Player (this, pattern, step, microstep): plays the slots marked by seq_units_start. First releases their live notes (0x08041078), then per slot reads the note at 0x08040EFC (`ldrb r5, [r4, #4]`, r4 = slot) and velocity at 0x08040EFE, and calls seq_note_on. Upstream's random-mutate replaces those two loads with a call (mutated note in r5); with Record it writes the mutated note back to [slot + 4]."
source = "upstream NOTAS.md SEQWD (device: 23 reads from here while playing, none stopped), SC39"

[hook.seq_play_step]
kind = "entry"
addr = 0x08040E5A
expect = "2de9f84f"   # push.w {r3, r4, r5, r6, r7, r8, r9, sl, fp, lr}
displace = 4
args = ["void *player", "uint32_t pattern", "uint32_t step", "uint32_t micro"]
ret = "void"
context = "any"
notes = "The player's step (function seq_play_step), at its entry: pattern is an index ([player + 0x48] + 0xCA8 × pattern), step 0-31, micro the microstep 0-5. The marks [player + 0x13C + micro] are a unit mask (bit u = unit u of the step, from seq_units_start: used, microstep = micro, probability passed); every marked unit is played in slot order, so a handler that clears a mark makes stock skip that unit entirely (its live pitch is not ended, no length-list entry, no note-on). A marked unit whose note's bit is set in [player + 0x128 + 4 (note >> 5)] (bit note & 31) is a held tie: it gets a new length-list entry and no sound. Stock's length (0x08040F02-0x08040F58): rate = *param_get([player + 0x10], 1) (> 7 -> 7), g = gate & 0x7F (0 -> 1, > 96 -> 96), ticks = g × step_ticks[rate] / 6 (0 -> 1); tie = gate bit 7. Task: Main in every call seen in emulation, step 0 too (the first heartbeat after Play, PL19 spike q4_tick0); context any, as the spec allowed tick 0 from the Play handler (UI). Only the note players' (vtable 0x0805B750) calls reach it; the drums' player is another class."
source = "re/app.asm 0x08040E5A-0x08040F6C; PL19 spike 2026-10-31 (docs/investigations/2026-10-31-pattern-strum-spike.md, q4_player, q4_tick0); features/chord/pstrum.c"

[function.seq_note_on]
addr = 0x08040FA2
expect = "2de9f041"   # push.w {r4, r5, r6, r7, r8, lr}
proto = "void seq_note_on(void *player, uint32_t note, uint32_t vel, uint32_t length, uint32_t tie)"
tags = ["takes_dsp_lock"]   # through the note interface: the router, the synth note-on 0x0803BD58
notes = "Player note-on (this, note, vel, length, tie): unless the note is a held tie (mask this + 0x128) calls slot 0 of the note interface [this + 0x4C] (vtable 0x0805BF54, the class of note_sink_on: playback and live pads meet in the router) and stores the note it was given in the length list this + 0x68 / 0x7C, so the note-off ends that note, not the step's. It takes the list's free head without checking (0x080410AC): never call it with [this + 0x78] == 0xFF. It stores length - 1, so the note ends at the length-th tick countdown after it; with tie it sets the note's bit in the tie-on mask [this + 0x54 ..]. PL19's late notes call it from the Main task (features/chord/pstrum.c)."
source = "upstream NOTAS.md SEQWD, SC39"

[function.seq_end_entry]
addr = 0x08041078
expect = "70b50446"   # push {r4, r5, r6, lr}; mov r4, r0
proto = "void seq_end_entry(void *player, uint32_t i)"
tags = ["takes_dsp_lock"]   # seq_note_off: slot 1 of the note interface, the synth note-off 0x0803BD94
notes = "Note-off of length-list entry i (seq_note_off: the note interface's slot 1, the tie-on bit cleared, [player + 0x9B + note] = 0xFF, the entry back on the free list) and its removal: the next entry's delta grows by its time, so the others keep their ends. [player + 0x9B + note] = the note's entry, 0xFF = none; length list links [player + 0x68 + 2 i] (i 0-7; free head at + 0x78 = link 8, used head at + 0x7A = link 9, sorted by end), times [+ 0x7C + 4 i] (deltas), notes [+ 0x7E + 4 i]. seq_play_step calls it for a marked unit's pitch still sounding (0x08040EAA) and for the used head when it needs room (0x08040F2A)."
source = "re/app.asm 0x08041078-0x080410AA, 0x080410CA; PL19 spike 2026-10-31"

