ret = "uint32_t"
context = "any"
notes = "Every caller of the commit (re/app.asm has no other reference): the note-off path 0x0803F60C (non-zero: it tail-jumps to the store touch 0x0803F8D4), the flush of notes 1-139 at Stop or Record off 0x0803F6A2 (every recorder; with a note still held it commits it) and the recorder's tick 0x0803F78C (Main task); the last two OR the result into their own touch flag. Handlers run after the commit (and its entry hook rec_commit), before the caller's store touch. After the commit the pending word reads 'nothing pending' either way (bits 0-2 = 7, the rest stale), so a handler that needs it latches it at rec_commit. The note-off path's and the flush's tasks are not identified."
