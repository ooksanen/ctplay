[hook.rec_quant]
kind = "mid"
addr = 0x0803FE8C
expect = "80f00100"   # eor.w r0, r0, #1 (then strb r0, [r7, #1] at 0x0803FE90: [rec + 0x35])
displace = 4
context = "any"
notes = "The recorders' store listener 0x0803FE24 (r5 = the recorder, note or drum: one listener for both; r7 = rec + 0x34) refreshes the record-quantise cache [rec + 0x35] here: r0 = bit 12 of parameter 2 of [rec + 0x24] (settings_store), the eor makes it stock's value (1 = quantise), the strb after it stores it. Reached only when the tick within the step ([[rec + 0xC]] parameter 2, r4) is 0 and [[rec + 0x20] = 0x2001150C] parameter 0 != 0: once per step at its tick 0 while the clock runs, each drum on its own sync. The listener's slot 5 (blx at 0x0803FEC8), later in the same call, reads the fresh value, so a byte written from the heartbeat alone loses to this refresh for a hit in the tick-0 window (placed a tick late). A handler sees stock's value in r0 and may change it. Main task while the clock runs; the task of every caller not identified."
source = "re/app.asm 0x0803FE24-0x0803FEC8; drums spike 2026-10-25 (docs/investigations/2026-10-25-drums-spike/u1_refresh.py: the refresh trace; u2_override.py, u3_window.py: the override at this instruction against stock's own quantise off)"
