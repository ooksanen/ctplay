proto = "uint32_t rec_write(void *rec, uint32_t note, uint32_t end)"
notes = "The recorder's commit as a function (hook rec_commit is its entry, hook rec_committed its callers): returns non-zero when it wrote into the pattern the recorder's store shows (its callers then make the store touch 0x0803F8D4). Gate: steps held = ((end - start) & 0x7FF) / ticks a step (step_ticks[[pattern + 0x382]], 0x0803F848-0x0803F856); 16 or more -> a flat 96 sixths (0x0803F85A), else 6 x steps + the sixths of the rest (at least 1). A call through its veneer runs the entry hook too."
