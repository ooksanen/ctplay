[data.recorders]
addr = 0x2003C174
ctype = "uint32_t"
notes = "The tracks' recorders (use its address): [recorders + 4 t] = note track t's recorder (rec_commit's rec), t = 0-3; [recorders + 4 (4 + d)] = [0x2003C184 + 4 d] = drum d's recorder (vtable 0x0805A578; [+ 0x48] its patterns, 0x6A8 B each; [+ 0x14] the drum editor's position store, parameter 0 bits 0-2 = the pattern the editor shows, the drum's shown pattern, which its step pads and stock's edits act on: PL17's drum_target; [+ 0x4C] the drum editor's step store, its editing copy of that pattern: [+ 0x0C] and [+ 0x10] its two buffers of 32 parameter words (parameter k = steps 4 (k % 8) .. + 3 of the velocity, probability, micro, flip arrays for k / 8 = 0-3), [+ 0x18] = + 0xA8 of the pattern it mirrors; PL17's drum Write writes both buffers, then store_touch_all and store_commit). [+ 0x35] = record quantise, 1 = on, for both kinds: a cache of !(bit 12 of parameter 2 of settings_store) that stock refreshes once per step at the step's tick 0 while the clock runs (hook rec_quant), so it reads 1 after Shift + Record turned quantise off until the next step boundary; the drum recorder reads nothing else for it. A hit through the expanded drum view's live sink (drum_expanded_vt) reaches it as a finger's does."
source = "tests/notes.py RECORDERS; hook rec_commit; drums spike 2026-10-25 (docs/investigations/2026-10-25-drums-spike/lib2.py DREC = 0x2003C184, r1_finger.py, r2_repeat.py; quantise: u1_refresh.py, u2_override.py, u3_window.py); position store: docs/investigations/2026-10-25-drums-pattern.md (asm 0x0803E18A, the dump)"

