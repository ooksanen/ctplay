# Named addresses of the official Circuit Tracks firmware 1.2.1 build 4486, checked against the stock image on every build.
# [function.NAME]  addr, expect (hex bytes at addr), proto (C prototype; omit = not callable from C), tags
#                  tag "takes_dsp_lock": takes the DSP-service lock directly or through anything it calls
# [data.NAME]      addr, ctype
# [hook.NAME]      kind = "entry" (addr, expect, displace) | "call" (target, sites); args (<= 4), ret, context = "ui" | "dsp_tick" | "main" | "dsp_locked" | "any"
#                  | "mid" (addr, expect, displace; no args, ret "void": the handlers get slim_regs_t *, every register)

[function.param_get]
addr = 0x0803542C
expect = "4268ca40"   # ldr r2, [r0, #4]; lsrs r2, r1
proto = "volatile uint8_t *param_get(void *store, uint32_t index)"
notes = "Pointer to parameter `index` of a parameter store; byte 0 is the value. Shift held = *param_get(*(ctrl + 0x0C), 0) != 0."
source = "upstream tools/build_sc03.py PARAM_GET; tools/build_sc15.py c_shift"

[function.led_task]
addr = 0x08034196
expect = "f0b589b0"   # push {r4, r5, r6, r7, lr}; sub sp, #0x24
proto = "void led_task(void *ctrl, uint16_t *out)"
notes = "Fills out[0..68] (one halfword per panel LED; 0-31 = pads) from the active view."
source = "upstream tools/leds18.py LED_TASK; LED map table 0x08059438"

[function.mark_group]
addr = 0x08021FDC
expect = "0228b8bf"   # cmp r0, #2; it lt
proto = "void mark_group(uint32_t type, uint32_t index)"
notes = "Marks a group for the DSP service without taking its lock: the safe alternative to mark_dirty from the DSP tick."
source = "upstream CLAUDE.md rules; tools/persist19.py FIX_LOCK"

[function.dsp_write]
addr = 0x080292F8
expect = "f8b50d46"   # push {r3, r4, r5, r6, r7, lr}; mov r5, r1
proto = "void dsp_write(uint32_t core, uint32_t value_shl8, uint32_t addr)"
notes = "ARM -> DSP write of one 24-bit word (value << 8)."
source = "upstream CLAUDE.md 'Plataforma'"

[function.dsp_read]
addr = 0x08029344
expect = "38b50446"   # push {r3, r4, r5, lr}; mov r4, r0
proto = "uint32_t dsp_read(uint32_t core, uint32_t addr)"
notes = "DSP -> ARM read; upstream reads Y memory with addr = 0x8000 | address."
source = "upstream CLAUDE.md rules; tools/meter20.py"

[function.mark_dirty]
addr = 0x0803BDCC
expect = "38b50d46"   # push {r3, r4, r5, lr}; mov r5, r1
tags = ["takes_dsp_lock"]
notes = "MARK_DIRTY: takes the DSP-service lock. Called from the DSP tick it hangs the device forever (upstream SC19). No prototype on purpose."
source = "upstream CLAUDE.md rules; docs/NOTAS.md 'SC19.3'"

[function.dsp_lock_take]
addr = 0x08021064
expect = "10b50446"   # push {r4, lr}; mov r4, r0
tags = ["takes_dsp_lock"]
notes = "Takes the DSP-service semaphore [ptr + 0xC]. No prototype on purpose."
source = "upstream CLAUDE.md rules"

[data.scb_vtor]
addr = 0xE000ED08
ctype = "uint32_t"
notes = "Cortex-M7 SCB->VTOR (vector table offset). Stock sets 0x08010000 at start-up (0x0801BC78...)."

[data.heap_start]
addr = 0x20002B40
ctype = "uint32_t"
notes = "Block allocator start pointer; 0x20006A58 on the device and in the RAM dump."

[data.heap_limit]
addr = 0x20002B44
ctype = "uint32_t"
notes = "Block allocator limit; 0x20044E58 after boot. slim lowers it to reserve its RAM."

[data.heap_cur]
addr = 0x20002B48
ctype = "uint32_t"
notes = "Block allocator current pointer; 0x20044D68 after boot on the device and in the RAM dump."

[hook.button_press]
kind = "entry"
addr = 0x08033320
expect = "38b50446"   # push {r3, r4, r5, lr}; mov r4, r0
displace = 4
args = ["void *ctrl", "uint32_t id"]
ret = "void"
context = "ui"
notes = "Button press handler (ctrl = 0x20040B10). Ids: 0-7 tracks, 8 Preset, 9 Note, 16 Record, 17 Play, 19 / 20 Octave, 23 Clear, 24 Duplicate, 27 Shift."

[hook.led_task]
kind = "call"
target = "led_task"
sites = [0x08033B46, 0x0803415A]
args = ["void *ctrl", "uint16_t *out"]
ret = "void"
context = "ui"
notes = "Both callers of the LED task; handlers run after stock and may overwrite out[]."

[hook.main_ms]
kind = "entry"
addr = 0x0803C410
expect = "10b50446"   # push {r4, lr}; mov r4, r0
displace = 4
args = ["uint32_t slot"]
ret = "void"
context = "main"
notes = "Stock's 1 ms dispatcher, Main task: slot 0 every 1 ms (runs the sequencer clock 0x0802A3F8), slot 1 every 333 ms. Reached from Main's soft timer 0x080234EC, before Main takes the DSP lock; runs with the transport stopped too. Only reference: the callback word 0x0803C490."
source = "event-queue spike 2026-10-12 (refs/archive/spike-event-queue, once branch spike/event-queue); spec 2026-10-12-strum-design.md"

# ---- Note view (Synth 1 / 2, MIDI 1 / 2): pad notes. Evidence: chord spike (refs/archive/spike-chord-probe, once branch spike/chord-probe), chord v1 spec.
[function.note_pad_index]
addr = 0x0804B174
expect = "38b50546"   # push {r3, r4, r5, lr}; mov r5, r0
proto = "uint32_t note_pad_index(void *view, uint32_t pad)"
notes = "Note view: pad 0-31 -> index into the keyboard table; pitch = [[view + 0x38] + 0x14 + idx] (root-relative, +12)."
source = "re/app.asm 0x0804AEF2 (stock pad note start)"

[function.kbd_pad_ignored]
addr = 0x080523E8
expect = "02690144"   # ldr r2, [r0, #0x10]; add r1, r0
proto = "uint32_t kbd_pad_ignored(void *kbd, uint32_t idx)"
notes = "Keyboard [view + 0x38]: non-zero when pitch + root is outside 12-139; stock then plays nothing for the pad."
source = "re/app.asm 0x0804AF02"


[function.cont_select_track]
addr = 0x08043448
expect = "7cb50446"   # push {r2, r3, r4, r5, r6, lr}; mov r4, r0
proto = "void cont_select_track(void *cont, uint32_t track)"
notes = "Track container [ctrl + 0x2C] (0x20040DB8) selects track 0-7: the first of the three calls stock's track-button case makes (0x08033400)."
source = "arpeggiator spike 2026-10-14 (spec 2026-10-14-arpeggiator-design.md)"

[function.cont_track_view]
addr = 0x0804348C
expect = "f8b50546"   # push {r3, r4, r5, r6, r7, lr}; mov r5, r0
proto = "void *cont_track_view(void *cont, uint32_t one)"
notes = "The selected track's view, as stock's track-button case asks it (second argument 1)."
source = "arpeggiator spike 2026-10-14"

[function.ctrl_set_view]
addr = 0x0803390C
expect = "f8b50446"   # push {r3, r4, r5, r6, r7, lr}; mov r4, r0
proto = "void ctrl_set_view(void *ctrl, void *view, uint32_t id)"
notes = "Makes `view` the controller's active view (id = the button). The three calls from a hook with Shift held leave the controller and every LED as a plain track press does (spike: from the Mixer, between all four tracks)."
source = "arpeggiator spike 2026-10-14"
[function.note_sink_on]
addr = 0x0801D38E
expect = "38b58468"   # push {r3, r4, r5, lr}; ldr r4, [r0, #8]
proto = "void note_sink_on(void *sink, uint32_t note, uint32_t vel, uint32_t pad)"
tags = ["takes_dsp_lock"]
notes = "Slot 0 of the Note view's sink [view + 0x18] (vtable 0x0805BF54, [sink + 0x0C] = track 0-3): router note-on with the pad as source. Reaches the synth note-on 0x0803BD58, which takes the DSP lock."
source = "re/app.asm 0x0804B07A; chord spike"

[function.note_sink_off]
addr = 0x0801D942
expect = "38b58468"   # push {r3, r4, r5, lr}; ldr r4, [r0, #8]
proto = "void note_sink_off(void *sink, uint32_t note, uint32_t pad)"
tags = ["takes_dsp_lock"]
notes = "Slot 1 of the Note view's sink: router note-off. Ignored unless `pad` still owns the note in the router."
source = "re/app.asm 0x0804AF5A; chord spike"

[function.track_of]
addr = 0x0805011E
expect = "80b5d0f8"   # push {r7, lr}; ldr.w r0, [r0, #0x188]
proto = "uint32_t track_of(void *container)"
notes = "Track-view container 0x20040DB8 -> selected track 0-7 (0-3 Synth 1, Synth 2, MIDI 1, MIDI 2)."
source = "upstream tools/build_sc08.py TRACK_OF"

[function.ctrl_press]
addr = 0x08033320
expect = "38b50446"   # push {r3, r4, r5, lr}; mov r4, r0
proto = "void ctrl_press(void *ctrl, uint32_t id)"
tags = ["takes_dsp_lock"]
notes = "The controller's button press (the hook button_press is its entry: a press made here goes through slim's handlers too). Play (17) starts the sequencer, whose tick 0 sounds notes."
source = "tests/harness.py BTN_PRESS; upstream tools/countin.py BTN_PRESS"

[function.ctrl_release]
addr = 0x0803381A
expect = "38b50446"   # push {r3, r4, r5, lr}; mov r4, r0
proto = "void ctrl_release(void *ctrl, uint32_t id)"
notes = "The controller's button release, the press's pair."
source = "tests/harness.py BTN_RELEASE; upstream tools/countin.py BTN_RELEASE"

[function.metro_set]
addr = 0x08031608
expect = "70b50126"   # push {r4, r5, r6, lr}; movs r6, #1
proto = "void metro_set(void *obj, uint32_t id, uint32_t value)"
tags = ["takes_dsp_lock"]
notes = "Stock's generic setting setter; (metro_obj, 0x64, 0 / 1) is Shift + Clear's metronome toggle: parameter 3 of the store [metro_obj + 0x38] (0x20010FAC), whose listener marks the master group 0x21:8 dirty."
source = "upstream tools/countin.py (SC41.8); PL08 spike 2026-10-17"

[function.synth_note_on]
addr = 0x0803BD58
expect = "7cb50d46"   # push {r2, r3, r4, r5, r6, lr}; mov r5, r1
proto = "void synth_note_on(uint32_t group, uint32_t note, uint32_t vel)"
tags = ["takes_dsp_lock"]
notes = "The synth note-on (the sinks reach it). Group 0xFF is the metronome: (0xFF, 0, 0x60) is stock's click, sent by the clock (object 0x20011364, Main task) on its beats through 0x0802AB0E; it writes master parameter 0x21:9 into the DSP's click trigger. Takes the DSP lock: never from the DSP tick."
source = "upstream tools/countin.py (SC41.8); tests/notes.py SYNTH_ON"

[data.metro_obj]
addr = 0x200109D8
ctype = "uint8_t"
notes = "Stock's settings object for metro_set (use its address); [+ 0x38] = the store whose parameter 3 is the metronome (0 / 1)."
source = "upstream tools/countin.py SET_OBJ, METRO_STORE"

[data.controller]
addr = 0x20040B10
ctype = "uint8_t"
notes = "The controller MGR (use its address). Shift held = *param_get(*(ctrl + 0x0C), 0) != 0; active view [ctrl + 0x6C]."

[data.track_container]
addr = 0x20040DB8
ctype = "uint8_t"
notes = "Track-view container (use its address). [+0x18C] mode: 1 Note view, 6 Note view expanded, 5 the probability view (Shift + Pattern Settings), 3 a drum's micro-step view (Gate); [+0x18 + 4 t] Note view of track t. Note from mode 5 gives 1; on a drum Note toggles 1 and 6, and the drum's button gives 1 from every view (PL20 TEST.md, emulation). Stock's Gate view on a note track: a step held, pads 17-32 are its gate bar, pad 17 + k sets every note of the step to k + 1 steps (6 ticks a step at 1/16)."

[data.drum_expanded_vt]
addr = 0x0805AD44
ctype = "uint32_t[]"
notes = "Vtable of the expanded drum view (a drum, Note pressed again: track container mode 6), one view for all four drums: [track_container + 0xAC]; pads 29-32 play drums 1-4. Its live sink [view + 0x10] (vtable 0x0805BF54, as the Note view's; [sink + 0x0C] = 0x10) records hits in modes 1 and 6; the player's sink does not. A drum button always gives mode 1 (steps on top 0x0805AD0C, samples below 0x0805ABBC), from every view tried."
source = "drums spike 2026-10-25: docs/investigations/2026-10-25-drums-emulation.md (spikes 1 and 2), 2026-10-25-drums-spike/drumlib.py VT, lib2.py, r4_sinks.py"

[data.note_router]
addr = 0x2003ECDC
ctype = "uint8_t"
notes = "Note router (vtable 0x0805B840; [+8] scale object, [+0xC] -> project root): one owner pad per note and track. Track t's pad notes: table [+0xD58 + 12 t], 2 B per note {pitch that took it, 0 = none; pad}, indexed by the scale-snapped pitch - [+0x98 + 3 t]. Note-on 0x080325AC ends a taken note, then writes both bytes; note-off 0x08032684 acts only when both match, then clears the pitch byte. Emulation probe, PL05 (2026-10-14)."

[data.tempo_store]
addr = 0x20011404
ctype = "uint8_t"
notes = "Project tempo parameter store ([[[0x200069E4] + 0x48] + 0x48], upstream): param_get(store, 0) = BPM (whole number), param 2 = swing (50 = straight). Double-buffered: read through param_get only. Swing is in the sequencer's tick timing: the first step of each pair takes s % of the pair."
source = "upstream docs/NOTAS.md 'Tiempo y tempo'; arpeggiator spike 2026-10-14"

[data.play_store]
addr = 0x20011034
ctype = "uint8_t"
notes = "Play store: param_get(store, 0) != 0 while the sequencer plays; parameter 1 != 0 while Record is armed (also when stopped). Parameter 2: stock records only while p0 && p1 && p2 == 0 (its listener 0x0803FFDC-0x0804001A flushes the recorders when that ends; PL19 pstrum_rec.c reads the same condition); what p2 means is unconfirmed (the count-in suspected)."
source = "event-queue spike 2026-10-12"

[data.project_root]
addr = 0x2003FA94
ctype = "uint8_t"
notes = "The project's root note 0-11 (the note router's [+0xC], the keyboard's [[kbd + 0x10]])."
source = "chord v1 spike; PL05 router probe"

[hook.pad_note_on]
kind = "entry"
addr = 0x0804AEF2
expect = "70b50546"   # push {r4, r5, r6, lr}; mov r5, r0
displace = 4
args = ["void *view", "uint32_t pad", "uint32_t vel"]
ret = "void"
context = "ui"
notes = "Note view: a key pad starts its note (both Note view modes). Only caller: the press handler 0x0804AB5A, after the fixed-velocity rule. Runs before stock's kbd_pad_ignored check."

[hook.pad_release]
kind = "entry"
addr = 0x0804ACC4
expect = "2de9f843"   # push.w {r3, r4, r5, r6, r7, r8, r9, lr}
displace = 4
args = ["void *view", "uint32_t pad"]
ret = "void"
context = "ui"
notes = "Note view release handler (vtable 0x0805A064 slot 1): every pad release, and stock calls it for every held pad when the view is left (through the vtable at 0x0804394A on a track change; Mixer releases pads 0-31 through the controller pad release 0x080332CE at 0x08033A76). It reaches pad_note_off only when the pad still owns a note: it returns at once when [view + 0x40 + pad] == 0 (0x0804ACD4; cleared by the note start when another pad takes the same pitch, 0x0804AF2C, and by the step-edit press, 0x0804AC74), and with a step held (p0 of [view + 0x2C]) whose notes contain the pad's pitch it only clears [0x40 / 0x60 + pad] (0x0804AD2A) and leaves the note to the step's release."


[hook.seq_tick]
kind = "entry"
addr = 0x0802C418
expect = "2de9f041"   # push.w {r4, r5, r6, r7, r8, lr}
displace = 4
args = ["void *engine"]
ret = "void"
context = "main"
notes = "Sequencer tick (24 PPQN, engine 0x20038EC0), only while playing; tail call from the clock listener 0x0802B8FC in the Main task's 1 ms service, after the main_ms dispatcher's entry. No position in its arguments. Tick 0 of a start is not here: seq_start."
source = "event-queue spike 2026-10-12; arpeggiator spike 2026-10-14"

[hook.seq_start]
kind = "entry"
addr = 0x0802C008
expect = "2de9f34f"   # push.w {r0, r1, r4-r11, lr}
displace = 4
args = ["void *engine"]
ret = "void"
context = "ui"
notes = "Plays tick 0 when Play starts the sequencer (Play handler 0x0802BBAA, after 0x0802BFE0), every start; stopping calls neither."
source = "arpeggiator spike 2026-10-14"

[hook.seq_place]
kind = "entry"
addr = 0x0802C240
expect = "2de9f04f"   # push.w {r4-r11, lr}
displace = 4
args = ["void *engine", "uint32_t track", "uint32_t tick", "uint32_t from_start"]
ret = "void"
context = "any"
notes = "Places track 0-7 (r1, uxtb at every caller) of the engine 0x20038EC0 at the song tick r2: its chain's pattern and step there. r3 = 1 from seq_start (it then updates the chain-done bits [E + 0xFC]), 0 from the engine listener. Callers: seq_start (lr 0x0802C1B0, all 8 tracks: Play from stop, the count-in's Play; also seq_tick's start path 0x0802C4DC when [E + 0xA5] is set, Main, static only), the listener's 'at once' call 0x0802B948 (Shift + a Patterns pad: the picked track; a load while playing: all 8), the stopped call 0x0802B9BA (a pick while stopped: the picked track; a scene or a load while stopped: all 8). Never reached by Shift + Play (continue), by a pick taken over at a pattern end or by a chain advancing by itself. Tasks: UI (the buttons and pads, the count-in's Play from the LED frame), the load's handler, Main (static)."
source = "PL20 builder check 2026-11-01 (docs/investigations/2026-11-01-trig-conditions-spike/B-counting.md 2-3); PL20 spike 2026-11-07 (docs/investigations/2026-11-07-trig-conditions-spike.md Q1, Q3: q3_tasks.py)"

[hook.track_advance]
kind = "mid"
addr = 0x0802CD42
expect = "9df84410"   # ldrb.w r1, [sp, #0x44] (then orrs r4, r1; beq 0x0802CE12)
displace = 4
context = "main"
notes = "The track advance 0x0802CB3C (called per track at each step's last tick or a scene change from seq_tick's loop via 0x0802C90C, fp = 0, and every tick for the look-ahead via 0x0802CA14, fp = 1) at its test 'the pattern ends or a scene changes'. After the displaced load r1 = the scene flag; the original sp = regs + 64: track = [sp + 0xC] (word), hand = [sp + 0x18] (the caller's r2: 1 while the track's chain-store hand flag (parameter 8 + t) is set and no scene waits, else the scene-change flag: so a waiting pick reads 1 at every step boundary, not only at its takeover), scene = [sp + 0x44]; r4 low byte = this step ends the pattern (count on it, not on the orrs: a scene cuts tracks mid-pattern with r4 = 0); sb = the pattern that ends (its index); fp (r11) = 1 for the look-ahead (it often has r4 = 1: ignore). Exactly one fp == 0 event with r4 or the scene flag per pass, before the next pass's first step (forward, reverse, ping-pong = there and back, random, every rate, chains, wrapping ranges, a 1-step pattern, muted tracks). A pick by hand takes over at the event with r4 = 1, hand 1, scene 0. A scene takes over for every track at once at Drum 1's pattern end (each track's event once, scene 1, hand 1 ended or cut); an advancing scene chain looks the same: the scene chain's parameter 1 ('picked by hand, waiting') is cleared at 0x0802C794 earlier in the same seq_tick, so read it at seq_tick's entry. Main only in every scenario (Q3)."
source = "re/app.asm 0x0802C7A4-0x0802C7D6, 0x0802CB3C-0x0802CD48; PL20 builder check 2026-11-01 (B-counting.md 1, 3: b_1_pass.py, b_3_hand.py, b_3_scene.py); PL20 spike 2026-11-07 (Q3: q3_tasks.py)"

[hook.player_tick]
kind = "mid"
addr = 0x0804A6C0
expect = "06eb4602"   # add.w r2, r6, r6, lsl #1 (the step's tick table index; after the random draw and its store)
displace = 4
context = "main"
notes = "A player's play pass 0x0804A684 (notes and drums, every player, muted ones too), every tick, before its microstep calls. r7 = the player (note track t: 0x20040200 + 0x184 t; drum d: 0x20040810 + 0x90 d), sb = the playing pattern, r8 = the step, r5 = the tick in the step (0 = tick 0), r6 = the sync rate; r1 is live (loaded at 0x0804A6BE). At tick 0 (r5 == 0) the step's random word is fresh in [r7 + 4] (drawn at 0x0804A6B8, stored at 0x0804A6BC; the probability tests compare against its low 3 bits). Tick 0 comes once per step, before every microstep call and probability test of that step (slot 1 at 0x0804A6DA, then 0x0804A714's slots 4 and 2) at every rate 0-7, both classes. 0x0804A6B8 itself cannot be a mid hook (a bl, then PC-relative code). Main only in every scenario (Play, count-in, loads, picks, scenes)."
source = "re/app.asm 0x0804A684-0x0804A714; PL20 builder check 2026-11-01 (docs/investigations/2026-11-01-trig-conditions-spike/B-counting.md 4: b_4_tick0.py); PL20 spike 2026-11-07 (Q3: q3_tasks.py)"

[hook.prob_view_note]
kind = "entry"
addr = 0x0804D0BC
expect = "38b50c46"   # push {r3, r4, r5, lr}; mov r4, r1
displace = 4
args = ["void *view", "uint32_t pad"]
ret = "void"
context = "ui"
notes = "A note track's probability view (class 0x0805ACD4, [track_container + 0x68 + 4 t], the bottom view in mode 5): its pad press, pad 0-15 of the view (0-7 row 3, 8-15 row 4 = the controller's 24-31; the container remaps). Row 4 returns at the bge (0x0804D112): nothing in stock (C-controls.md Q1). Row 3: accepted when a step pad is held ([[view + 0xC] + 0x10] p0), or stopped ([view + 0x10] p0 == 0, the play store), or the editors do not follow the playhead ([view + 0x14] p0 = 0x20039DE0's, set), and the edit store [[view + 0xC] + 8] (= [editor + 0x20], editor = [view + 0xC] - 0x18) has notes in word 0's byte 0; it writes the probability through param_wptr(store, 0) byte 1 and commits (the selected step: [editor + 0x24] p0 & 7 / p1). Shift changes nothing here."
source = "re/app.asm 0x0804D0BC-0x0804D112; PL20 builder check 2026-11-01 (docs/investigations/2026-11-01-trig-conditions-spike/C-controls.md Q1: c_1_prob_row4.py, c_2_prob_row3.py); PL20 spike 2026-11-07 (Q4: q4_stores.py)"

[hook.prob_view_drum]
kind = "entry"
addr = 0x0804F262
expect = "2de9f845"   # push.w {r3, r4, r5, r6, r7, r8, sl, lr}
displace = 4
args = ["void *view", "uint32_t pad"]
ret = "void"
context = "ui"
notes = "A drum's probability view (class 0x0805AB14, [track_container + 0xE0 + 4 d]): its pad press, pad 0-15 as the note class's. Row 4 returns at the bge (0x0804F31C). Row 3: the same accept rule with the held store at [[view + 0xC] + 0xC]; the step = [[view + 0xC] + 8] p1 (the drum editor's position store [editor + 0x20], editor = [view + 0xC] - 0x18), the pattern = the recorder's shown one ([[0x2003C184 + 4 d] + 0x14] p0 & 7); an empty step gets a hit (velocity 0x60) first, then the probability through the step store [[view + 0xC]]."
source = "re/app.asm 0x0804F262-0x0804F31C; PL20 builder check 2026-11-01 (C-controls.md Q1); PL20 spike 2026-11-07 (Q4: q4_stores.py)"

[hook.cont_release]
kind = "entry"
addr = 0x080435F0
expect = "f8b50446"   # push {r3, r4, r5, r6, r7, lr}; mov r4, r0
displace = 4
args = ["void *cont", "uint32_t pad"]
