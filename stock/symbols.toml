[hook.rec_commit]
kind = "entry"
addr = 0x0803F7BE
expect = "034603eb81002de9f04e"   # mov r3, r0; add.w r0, r3, r1, lsl #2; push.w {r4-r7, sb, sl, fp, lr}
displace = 6
args = ["void *rec", "uint32_t note", "uint32_t end"]
ret = "uint32_t"
context = "any"
notes = "Tasks (PL19 spike q1_tasks): UI (stock's pad note-off; the flush at Stop and Record off, 0x0803F6A2) and Main (the heartbeat's note-offs, the tick pass 0x0803F78C). The recorder's commit (rec = [0x2003C174 + 4 t]): writes the note's unit into its step at the note's end, from the pending word [rec + 0x9C + 4 note] (bits 0-2 unit, 7 = nothing pending: returns 0 at once; 3-7 step, 8-10 pattern, 11-17 velocity, 18-28 start = the note-on's tick, counted from Play mod 2048 (a pass later it differs: 768 for 8 x 16 steps), 29-31 microstep). Reuses the step's unit with the same note and microstep, else unit bits 0-2; length = end - start in ticks. Then sets bits 0-2 to 7, so after it a write and a no-op look the same: hence an entry hook. Callers: the recorder's tick processing (0x0803F78C, Main task: notes placed and released), its note-off path (0x0803F60C) and its flush of notes 1-139 (0x0803F6A2, mostly no-ops). Notes not yet placed wait in rec + 0x54 (6 x 12 B: [0] note, 0 = empty; [3] bit 0 released; [4] bits 0-10 start, 11-21 end). The commit's store touch after it (0x0803F8D4: write pointer, commit) copies the live pattern through the store's staging buffer, so an edit made before stock's write is kept; no editing copy writes a note track's steps back (PL08 spike: step edit, view round trip, playback). Record quantise: the note-on's placement (0x0803F298) reads [rec + 0x35]; set (quantise on, the default) = the note goes on a whole step, microstep 0 (which way an off-grid note rounds: not traced); 0 = start keeps the note's offset in the step and the microstep comes from it (0x0803F8F6 -> 0x0804A314: tick offset -> 0-5 for the track's sync rate). [rec + 0x35] = !(bit 12 of parameter 2 of the store [rec + 0x24] = the settings store 0x200111CC), set by the constructor (0x0803FBC4) and the recorder's store listener (0x0803FE90). Shift + Record flips that bit (0x08045A44, the Record / Play object [ctrl + 0x4C], its [+ 0x1C]) and Record's LED with Shift reads it (0x08045B0E): stock's Shift + Record = record quantise (on Circuit since its firmware 1.8: Record bright = on, dim = off; saved with the device settings)."
source = "re/app.asm; PL08 mono record spike 2026-10-17 (emulation); record quantise: re/app.asm 2026-10-17, device RAM snapshot (all four recorders: [+ 0x24] = 0x200111CC, [+ 0x35] = 1)"

